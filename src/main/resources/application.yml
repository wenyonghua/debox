server:
  port: 8080

spring:
  application:
    name: debox-reward-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/debox_reward?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.debox.reward: debug

security:
  jwt:
    # 需要至少 32 字节（HS256）。生产环境请替换并保密
    secret: "debox-reward-jwt-secret-please-change-32bytes!"
    expire-seconds: 86400
